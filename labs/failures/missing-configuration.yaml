apiVersion: v1
kind: Pod
metadata:
  name: missing-configmap-demo
  namespace: kubelens-lab
  labels:
    app: kubelens-demo
spec:
  restartPolicy: Never
  containers:
    - name: config-app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      envFrom:
        - configMapRef:
            name: kubelens-nonexistent-configmap
            optional: false
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: missing-secret-demo
  namespace: kubelens-lab
  labels:
    app: kubelens-demo
spec:
  restartPolicy: Never
  containers:
    - name: secret-app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      envFrom:
        - secretRef:
            name: kubelens-nonexistent-secret
            optional: false
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
