apiVersion: v1
kind: Pod
metadata:
  name: failed-mount-demo
  namespace: kubelens-lab
  labels:
    app: kubelens-demo
spec:
  restartPolicy: Never
  containers:
    - name: mount-app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: settings
          mountPath: /app/config
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
  volumes:
    - name: settings
      configMap:
        name: kubelens-nonexistent-volume-config
        optional: false
