apiVersion: v1
kind: Pod
metadata:
  name: unschedulable-demo
  namespace: kubelens-lab
  labels:
    app: kubelens-demo
spec:
  restartPolicy: Never
  nodeSelector:
    kubelens.dev/placement: nonexistent
  containers:
    - name: test-app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
