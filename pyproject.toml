[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kubelens-doctor"
version = "0.1.0"
description = "Evidence-based Kubernetes troubleshooting CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["kubernetes>=34,<40"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
kubelens = "kubelens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
